name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  standalone:
    # The tier that needs neither a harness checkout nor a built engine: id
    # admission, config validation, the JSON Lines reader, and the rewind-point
    # projection. Every import it reaches into the harness is type-only.
    name: standalone tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm run test:standalone

  full:
    # The tiers that drive the real engine and the real harness. Both are built
    # from source here, because this plugin's contract is with what those
    # projects ship rather than with a fixture of them.
    name: engine and service tests
    runs-on: ubuntu-latest
    # Set once for the job, not passed per step: `build:client` runs inside
    # `prepublishOnly` too, where an argument cannot reach it. Both scripts read
    # this, so one mechanism covers every call.
    env:
      DSH_HARNESS: ${{ github.workspace }}/.harness
    steps:
      - uses: actions/checkout@v4
      # Inside the workspace: `actions/checkout` refuses a path outside it,
      # which an earlier draft of this file did not respect. The engine is no
      # longer checked out at all — `filesnap` is a dependency, so `npm ci`
      # brings the prebuilt binary the suites drive.
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          # Keep the oldest supported build target; the published-runtime job
          # below separately exercises the current persistence generation.
          ref: dsh-v0.1.2-rc.1
          path: .harness
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: build the harness
        working-directory: .harness
        run: pnpm install --ignore-scripts && pnpm run build
      - run: npm ci
      - run: npm run harness:link
      # Also here, where a real `.harness` directory sits inside the workspace:
      # the release runs this inside `prepublishOnly` under the same layout, and
      # a release must never be the first environment a check is exercised in.
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:client

  published-runtime:
    name: published harness 0.2.1-rc.2 runtime tests
    runs-on: ubuntu-latest
    env:
      HARNESS_RUNTIME: ${{ runner.temp }}/filesnap-harness-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Install the shipped composition in isolation. Component packages'
      # `latest` tags can lag the CLI, so pin the same published version.
      # This does not rewrite the plugin's manifest or lockfile.
      - name: install published runtime and existing test dependencies
        run: |
          npm install --prefix "$HARNESS_RUNTIME" --ignore-scripts --no-audit --no-fund \
            @deepseek-ai/dsh@0.2.1-rc.2 \
            @deepseek-ai/dsh-session-persistence-jsonl@0.2.1-rc.2 \
            vitest@3.2.7 filesnap@0.5.1 zod@4.4.3
          ln -s "$HARNESS_RUNTIME/node_modules" node_modules
      - run: npm test
